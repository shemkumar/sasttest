version: '3.3'
services:
  app:
    build: .
    privileged: true
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=compose-hardcoded-secret
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - /:/host
  db:
    image: mysql:5.5
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
